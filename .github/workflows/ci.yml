name: CI

on:
  push:
    # Toutes les branches de travail, pas seulement feat/**. Avant, un push sur
    # fix/**, docs/** ou chore/** ne déclenchait AUCUN run : on pouvait croire une
    # branche verte alors que rien n'avait tourné. Le vert n'arrivait qu'à
    # l'ouverture de la PR (l'événement pull_request ci-dessous n'a pas de filtre).
    branches: [main, "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: "file:./ci.db"
  AUTH_SECRET: "ci-placeholder-secret-0123456789-abcdefghijkl"

jobs:
  build:
    name: Build (Next.js + Prisma/SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      # --legacy-peer-deps : le projet a un conflit de peer-deps connu
      # (@blocknote/mantine veut @mantine/core@^8, le projet est en v9).
      # L'install locale et le lockfile reposent dessus.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Prisma generate
        run: npx prisma generate
      - name: Build
        run: npm run build

  migrations:
    name: Migrations en phase avec le schéma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      # Garde-fou : un schema.prisma modifié sans migration correspondante fait
      # échouer la CI (exit 2). Empêche le drift schéma ⇄ migrations en prod.
      - name: Aucune migration manquante (schéma == migrations)
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

  baseline-figee:
    name: Baseline figée (0_init immuable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # ⚠️ Une migration DÉJÀ APPLIQUÉE en production n'est jamais rejouée par
      # `migrate deploy`, qui ne revérifie pas non plus son checksum. Modifier
      # 0_init après la baseline produirait donc un déploiement VERT sur un
      # schéma incomplet : l'erreur n'apparaîtrait qu'à la première requête
      # touchant la colonne absente. Toute évolution passe par une NOUVELLE
      # migration (`prisma migrate dev --name …`).
      - name: 0_init ne doit plus changer une fois en production
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1 --quiet
          # Avant la bascule, 0_init n'existe pas encore sur la branche de base :
          # c'est la PR qui l'introduit, le contrôle ne s'applique pas.
          if ! git cat-file -e "origin/$BASE_REF:prisma/migrations/0_init/migration.sql" 2>/dev/null; then
            echo "0_init absent de origin/$BASE_REF — bascule initiale, contrôle non applicable."
            exit 0
          fi
          if ! git diff --quiet "origin/$BASE_REF" -- prisma/migrations/0_init/migration.sql; then
            echo "prisma/migrations/0_init/migration.sql a été modifié."
            echo "Cette migration est marquée appliquée en production : elle ne sera JAMAIS rejouée."
            echo "Créer une nouvelle migration au lieu de modifier celle-ci."
            exit 1
          fi
          echo "0_init inchangé."

  test:
    name: Tests unitaires + API (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Prisma generate
        run: npx prisma generate
      - name: Vitest (unit + API)
        run: npm test

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Prisma generate
        run: npx prisma generate
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
