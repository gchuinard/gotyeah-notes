name: CI

on:
  push:
    # Toutes les branches de travail, pas seulement feat/**. Avant, un push sur
    # fix/**, docs/** ou chore/** ne déclenchait AUCUN run : on pouvait croire une
    # branche verte alors que rien n'avait tourné. Le vert n'arrivait qu'à
    # l'ouverture de la PR (l'événement pull_request ci-dessous n'a pas de filtre).
    branches: [main, "feat/**", "fix/**", "docs/**", "chore/**"]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: "file:./ci.db"
  AUTH_SECRET: "ci-placeholder-secret-0123456789-abcdefghijkl"

jobs:
  build:
    name: Build (Next.js + Prisma/SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      # --legacy-peer-deps : le projet a un conflit de peer-deps connu
      # (@blocknote/mantine veut @mantine/core@^8, le projet est en v9).
      # L'install locale et le lockfile reposent dessus.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Prisma generate
        run: npx prisma generate
      - name: Build
        run: npm run build

  test:
    name: Tests unitaires + API (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Prisma generate
        run: npx prisma generate
      - name: Vitest (unit + API)
        run: npm test

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Prisma generate
        run: npx prisma generate
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
