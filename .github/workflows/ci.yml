name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (Next.js + Prisma/SQLite)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./ci.db"
      AUTH_SECRET: "ci-placeholder-secret-0123456789-abcdefghijkl"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
      # --legacy-peer-deps : le projet a un conflit de peer-deps connu
      # (@blocknote/mantine veut @mantine/core@^8, le projet est en v9).
      # L'install locale et le lockfile reposent dessus.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Prisma generate
        run: npx prisma generate
      - name: Build
        run: npm run build
