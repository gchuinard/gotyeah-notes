name: Deploy

# Le déploiement attend la CI : il ne part qu'après un run CI réussi sur un push
# de main, et installe le commit que ce run a testé. Jusqu'au 25/09/2026, il
# partait au push, en parallèle de la CI : un commit aux tests rouges était
# déployé quand même.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  # Lecture des runs de CI : un lancement manuel vérifie que le commit est vert.
  actions: read

jobs:
  deploy:
    # Seul un push sur main compte : le run CI d'une pull request (même venue
    # d'un fork dont la branche s'appelle main) ne déploie jamais.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Sans empreinte, appleboy/ssh-action désactive la vérification de l'hôte
      # en silence : on refuse donc de déployer si le secret est vide.
      - name: Vérifier que l'empreinte du Pi et la clé de déploiement sont configurées
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::Secret SSH_HOST_FINGERPRINT absent : sans lui, le déploiement accepterait n'importe quel hôte."
            exit 1
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret SSH_KEY absent."
            exit 1
          fi

      # Lancement manuel : pas de run CI en amont, on vérifie donc qu'il en
      # existe un réussi sur ce commit, et qu'il s'agit bien de main.
      - name: Vérifier que la CI est verte sur ce commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Le déploiement manuel ne part que de main."
            exit 1
          fi
          verts=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$DEPLOY_SHA" --status success --json databaseId --jq length)
          if [ "$verts" = "0" ]; then
            echo "::error::Aucun run CI réussi sur $DEPLOY_SHA : pas de déploiement."
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Clé dédiée à Notes depuis le 25/09/2026 (jusque-là, une clé sans restriction :
          # root de fait sur le Pi). Sur le Pi, authorized_keys la force sur
          # « /usr/local/sbin/gotyeah-deploy notes » : git fetch, contrôle que DEPLOY_SHA est
          # encore la pointe de main (sinon « main a avancé… » et succès, la prod ne recule
          # jamais), puis deploy/pi-deploy.sh lu dans ce commit. Elle ne peut rien faire d'autre.
          key: ${{ secrets.SSH_KEY }}
          # Empreinte ECDSA du Pi (secret, jamais en clair dans ce dépôt public) :
          # un hôte qui présente une autre clé fait échouer la connexion (24/09).
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          # Le build tourne sur le Pi, et gotyeah-deploy peut attendre jusqu'à 15 min le
          # verrou d'un déploiement de notes déjà en cours.
          command_timeout: 20m
          # Seule commande que le Pi accepte avec cette clé : « deploy <sha40> ». Les étapes
          # (reset, garde .md, snapshot SQLite vérifié, migrations, rebuild, attente healthy)
          # vivent dans deploy/pi-deploy.sh. Plus de script_stop ni d'envs : l'action
          # ajouterait des lignes à la commande, et le Pi la refuserait.
          script: deploy ${{ env.DEPLOY_SHA }}
