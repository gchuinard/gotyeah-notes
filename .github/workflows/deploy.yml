name: Deploy

on:
  push:
    branches: [main]
    # Évite un build/déploiement sur le Pi pour des changements purement documentaires
    # (un commit mêlant doc + code déclenche quand même le déploiement).
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /home/pi/sites/gotyeah-notes
            git fetch --prune origin
            git reset --hard origin/main

            # ── Filet de sécurité : SNAPSHOT de la DB SQLite AVANT tout déploiement ──
            # sqlite3 .backup (pas cp) = cohérent même sous WAL / écritures concurrentes.
            # Un échec ARRÊTE le déploiement (set -e) : jamais de MEP sans backup vérifié.
            BACKUP_DIR=/home/pi/backups/gotyeah-notes
            STAMP=$(date +%Y%m%d-%H%M%S)
            mkdir -p "$BACKUP_DIR"
            # Résout le volume réel (…_gotyeah-db) sans coder en dur le préfixe de projet :
            # une divergence de nom bloquerait sinon TOUS les déploiements.
            DB_VOL=$(docker volume ls -q | grep -E '(^|_)gotyeah-db$' | head -1)
            [ -n "$DB_VOL" ] || { echo "Volume gotyeah-db introuvable — abandon."; exit 1; }
            # --user 0:0 : le dossier de backup appartient à l'utilisateur hôte (pi) ;
            # l'image keinos tourne en non-root et ne pouvait pas y écrire (« cannot open »).
            # root lit le volume (world-readable) ET écrit dans le dossier hôte (bypass DAC).
            docker run --rm --user 0:0 \
              -v "$DB_VOL":/data:ro \
              -v "$BACKUP_DIR":/backup \
              keinos/sqlite3:latest \
              sqlite3 /data/dev.db ".backup '/backup/dev-$STAMP.db'"
            # Vérif d'intégrité du snapshot (grep -q échoue → set -e arrête le déploiement).
            docker run --rm --user 0:0 -v "$BACKUP_DIR":/backup keinos/sqlite3:latest \
              sh -c "sqlite3 /backup/dev-$STAMP.db 'PRAGMA integrity_check' | grep -q '^ok$'"
            echo "Snapshot OK: $BACKUP_DIR/dev-$STAMP.db"
            # Rotation locale + réplication hors-Pi : best-effort, ne doivent JAMAIS
            # bloquer le déploiement (la garantie dure, c'est le snapshot vérifié
            # ci-dessus, sous set -e). On coupe set -e le temps de ce bloc optionnel :
            # sous `set -euo pipefail`, un `[ -f absent ] && … || true` ou un `find`
            # peut sinon avorter tout le script.
            set +e
            find "$BACKUP_DIR" -name 'dev-*.db' -mtime +7 -delete 2>/dev/null
            [ -f /home/pi/.gotyeah-backup.env ] && . /home/pi/.gotyeah-backup.env
            if command -v restic >/dev/null 2>&1 && [ -n "${RESTIC_REPOSITORY:-}" ]; then
              restic backup "$BACKUP_DIR/dev-$STAMP.db" --tag gotyeah-notes \
                && restic forget --keep-daily 7 --prune \
                || echo "Réplication restic échouée (non bloquant)."
            else
              echo "restic non configuré → réplication hors-Pi ignorée."
            fi
            set -e

            docker compose up -d --build
            for i in $(seq 1 60); do
              health=$(docker inspect --format '{{.State.Health.Status}}' gotyeah_notes 2>/dev/null || echo missing)
              if [ "$health" = "healthy" ]; then
                echo "App healthy."
                exit 0
              fi
              echo "Waiting for app to be healthy (health=$health)..."
              sleep 2
            done
            echo "App did not become healthy in time."
            docker logs --tail 200 gotyeah_notes || true
            exit 1
