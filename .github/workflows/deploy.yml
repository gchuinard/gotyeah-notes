name: Deploy

# Le déploiement attend la CI : il ne part qu'après un run CI réussi sur un push
# de main, et installe le commit que ce run a testé. Jusqu'au 25/09/2026, il
# partait au push, en parallèle de la CI : un commit aux tests rouges était
# déployé quand même.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  # Lecture des runs de CI : un lancement manuel vérifie que le commit est vert.
  actions: read

jobs:
  deploy:
    # Seul un push sur main compte : le run CI d'une pull request (même venue
    # d'un fork dont la branche s'appelle main) ne déploie jamais.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # Sans empreinte, appleboy/ssh-action désactive la vérification de l'hôte
      # en silence : on refuse donc de déployer si le secret est vide.
      - name: Vérifier que l'empreinte du Pi est configurée
        env:
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          if [ -z "$SSH_HOST_FINGERPRINT" ]; then
            echo "::error::Secret SSH_HOST_FINGERPRINT absent : sans lui, le déploiement accepterait n'importe quel hôte."
            exit 1
          fi

      # Lancement manuel : pas de run CI en amont, on vérifie donc qu'il en
      # existe un réussi sur ce commit, et qu'il s'agit bien de main.
      - name: Vérifier que la CI est verte sur ce commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Le déploiement manuel ne part que de main."
            exit 1
          fi
          verts=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$DEPLOY_SHA" --status success --json databaseId --jq length)
          if [ "$verts" = "0" ]; then
            echo "::error::Aucun run CI réussi sur $DEPLOY_SHA : pas de déploiement."
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Empreinte ECDSA du Pi (secret, jamais en clair dans ce dépôt public) :
          # un hôte qui présente une autre clé fait échouer la connexion (24/09).
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script_stop: true
          command_timeout: 20m
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            cd /home/pi/sites/gotyeah-notes
            git fetch --prune origin
            # Deux CI peuvent finir dans le désordre : on ne déploie le commit testé
            # que s'il est encore la pointe de main. Sinon, le commit suivant sera
            # déployé après sa propre CI, et la prod ne recule jamais.
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then echo "main a avancé depuis $DEPLOY_SHA : rien à déployer ici."; exit 0; fi
            EN_LIGNE=$(git rev-parse HEAD)
            git reset --hard "$DEPLOY_SHA"
            # Reprend l'ancien « paths-ignore: **.md » du déclencheur push : si seuls
            # des .md ont changé depuis la version en ligne, rien à reconstruire (le
            # build sur le Pi est lourd). Un redéploiement du même commit, lui, va au bout.
            HORS_MD=$(git diff --name-only "$EN_LIGNE" "$DEPLOY_SHA" -- ':(exclude)*.md')
            if [ "$EN_LIGNE" != "$DEPLOY_SHA" ] && [ -z "$HORS_MD" ]; then echo "Seuls des fichiers .md ont changé : pas de reconstruction."; exit 0; fi

            # ── Filet de sécurité : SNAPSHOT de la DB SQLite AVANT tout déploiement ──
            # sqlite3 .backup (pas cp) = cohérent même sous WAL / écritures concurrentes.
            # Un échec ARRÊTE le déploiement (set -e) : jamais de MEP sans backup vérifié.
            BACKUP_DIR=/home/pi/backups/gotyeah-notes
            STAMP=$(date +%Y%m%d-%H%M%S)
            mkdir -p "$BACKUP_DIR"
            # Résout le volume réel (…_gotyeah-db) sans coder en dur le préfixe de projet :
            # une divergence de nom bloquerait sinon TOUS les déploiements.
            DB_VOL=$(docker volume ls -q | grep -E '(^|_)gotyeah-db$' | head -1)
            [ -n "$DB_VOL" ] || { echo "Volume gotyeah-db introuvable — abandon."; exit 1; }
            # --user 0:0 : le dossier de backup appartient à l'utilisateur hôte (pi) ;
            # l'image keinos tourne en non-root et ne pouvait pas y écrire (« cannot open »).
            # root lit le volume (world-readable) ET écrit dans le dossier hôte (bypass DAC).
            docker run --rm --user 0:0 \
              -v "$DB_VOL":/data:ro \
              -v "$BACKUP_DIR":/backup \
              keinos/sqlite3:latest \
              sqlite3 /data/dev.db ".backup '/backup/dev-$STAMP.db'"
            # Vérif d'intégrité du snapshot (grep -q échoue → set -e arrête le déploiement).
            docker run --rm --user 0:0 -v "$BACKUP_DIR":/backup keinos/sqlite3:latest \
              sh -c "sqlite3 /backup/dev-$STAMP.db 'PRAGMA integrity_check' | grep -q '^ok$'"
            echo "Snapshot OK: $BACKUP_DIR/dev-$STAMP.db"
            # IMPORTANT : le client SSH (appleboy/ssh-action, script_stop:true) stoppe le
            # déploiement au moindre code de retour non nul d'une commande — indépendamment
            # de `set +e`/`|| true` dans le shell distant. On ne met donc AUCUNE étape
            # best-effort ici. Rotation des snapshots (7 j) et réplication hors-Pi (restic)
            # sont à planifier via un cron dédié sur le Pi, HORS du chemin critique de MEP
            # (voir README « Sauvegardes »). Seul le snapshot vérifié ci-dessus bloque une MEP.

            docker compose up -d --build
            for i in $(seq 1 60); do
              health=$(docker inspect --format '{{.State.Health.Status}}' gotyeah_notes 2>/dev/null || echo missing)
              if [ "$health" = "healthy" ]; then
                echo "App healthy."
                exit 0
              fi
              echo "Waiting for app to be healthy (health=$health)..."
              sleep 2
            done
            echo "App did not become healthy in time."
            docker logs --tail 200 gotyeah_notes || true
            exit 1
