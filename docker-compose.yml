name: gotyeah-notes

services:
  # One-shot: applies the Prisma schema to the SQLite file on the shared volume,
  # then exits. Runs the prisma CLI from the `builder` stage (it has the CLI,
  # engines, schema and config — the runtime image deliberately doesn't).
  migrate:
    build:
      context: .
      target: builder
    image: gotyeah-notes-migrate
    user: "1001:1001"
    environment:
      DATABASE_URL: "file:/data/dev.db"
      HOME: /tmp
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    volumes:
      - gotyeah-db:/data
    restart: "no"

  app:
    build:
      context: .
      target: runner
    image: gotyeah-notes
    container_name: gotyeah_notes
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/data/dev.db"
    # Reached by Nginx Proxy Manager over the shared external network, as
    # gotyeah_notes:3000 (no host port published — same convention as the other
    # apps on this Pi). Add `ports: ["30001:3000"]` if you need direct access.
    networks:
      - npm
    volumes:
      - gotyeah-db:/data
    restart: unless-stopped

volumes:
  gotyeah-db:

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
