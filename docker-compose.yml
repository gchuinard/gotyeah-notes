name: gotyeah-notes

services:
  # One-shot: applies the Prisma schema to the SQLite file on the shared volume,
  # then exits. Runs the prisma CLI from the `builder` stage (it has the CLI,
  # engines, schema and config — the runtime image deliberately doesn't).
  migrate:
    build:
      context: .
      target: builder
    image: gotyeah-notes-migrate
    user: "1001:1001"
    environment:
      DATABASE_URL: "file:/data/dev.db"
      HOME: /tmp
    # Applique UNIQUEMENT les migrations versionnées (prisma/migrations), jamais un
    # `db push` qui inférerait des DROP destructifs. La base de prod doit avoir été
    # « baselinée » une fois (`migrate resolve --applied 0_init`) — voir README §Migrations.
    command: ["npx", "prisma", "migrate", "deploy"]
    volumes:
      - gotyeah-db:/data
    restart: "no"

  app:
    build:
      context: .
      target: runner
    image: gotyeah-notes
    container_name: gotyeah_notes
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: "file:/data/dev.db"
      # Uploads (images collées dans l'éditeur) : même volume que la DB SQLite.
      # À inclure dans les backups (data/uploads/ en plus de dev.db).
      UPLOAD_DIR: "/data/uploads"
      # Pont de confiance du serveur MCP (cf. lib/session.ts). Doit valoir le même
      # secret que NOTES_MCP_SECRET côté MCP. Vide = chemin act-as désactivé.
      MCP_SHARED_SECRET: "${MCP_SHARED_SECRET:-}"
      # Allowlist des emails que le pont MCP peut incarner (séparés par des virgules).
      # Vide = comportement historique : n'importe quel User existant est incarnable.
      # Définie = seuls ces emails sont acceptés, les autres sont refusés + journalisés.
      # ⚠️ Ce compose n'utilise PAS env_file : sans cette ligne, la variable posée dans
      # le .env du Pi n'atteignait jamais le conteneur — la garde était inerte.
      MCP_ACT_AS_ALLOWLIST: "${MCP_ACT_AS_ALLOWLIST:-}"
      # Connexion OIDC (bouton « Se connecter avec GotYeah », cf. lib/oidc.ts).
      # Les 4 premières vides = bouton masqué. Client confidentiel créé dans Keycloak.
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      # ⚠️ Défaut "false" (durci le 05/08) : le realm Keycloak `gotyeah` est
      # PARTAGÉ par tous les sites de l'écosystème. À "true", l'utilisateur de
      # n'importe lequel d'entre eux obtenait un compte notes en cliquant
      # « Se connecter ». À "false", seule une invitation vivante ouvre la porte
      # (cf. hasPendingInvitation). L'IdP dit QUI tu es, l'invitation dit si tu
      # es attendu ICI.
      OIDC_ALLOW_SIGNUP: "${OIDC_ALLOW_SIGNUP:-false}"
      OIDC_BUTTON_LABEL: "${OIDC_BUTTON_LABEL:-Se connecter avec GotYeah}"
      # Login mot de passe : "off" pour passer en « comptes GotYeah uniquement ».
      LEGACY_LOGIN: "${LEGACY_LOGIN:-on}"
      # Inscription par formulaire : "off" par défaut (découplée du login legacy et de
      # l'OIDC). Mettre "on" pour rouvrir POST /api/auth/register.
      REGISTRATION: "${REGISTRATION:-off}"
      # Connexion par lien email — le canal des invites, qui n'ont pas de compte
      # dans le realm partage. "off" le ferme (cf. lib/magicLink.ts).
      MAGIC_LINK: "${MAGIC_LINK:-on}"
      # Envoi des emails d'invitation (API HTTP Brevo, cf. lib/mailer.ts).
      # ⚠️ Ce compose n'utilise PAS env_file : sans ces 4 lignes, une clé posée
      # dans le .env du Pi n'atteindrait jamais le conteneur et l'envoi resterait
      # inerte — c'est exactement ce qui est arrivé à MCP_ACT_AS_ALLOWLIST.
      # Clé vide = envoi désactivé, les invitations sont créées quand même.
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-GotYeah Notes}"
      # Origine publique des liens d'email. Vide = repli sur OIDC_REDIRECT_URI.
      APP_BASE_URL: "${APP_BASE_URL:-}"
      # Provisioning des invités dans Keycloak (cf. lib/keycloak.ts). Vides =
      # désactivé, le compte IdP se crée alors à la main. ⚠️ Le client doit
      # porter le SEUL rôle manage-users, jamais realm-admin : ce secret vit
      # dans une application web exposée.
      KEYCLOAK_ADMIN_CLIENT_ID: "${KEYCLOAK_ADMIN_CLIENT_ID:-}"
      KEYCLOAK_ADMIN_CLIENT_SECRET: "${KEYCLOAK_ADMIN_CLIENT_SECRET:-}"
      # ⚠️ /admin/* est protégé par Cloudflare Access côté public (302 vers un
      # écran de connexion). On joint donc Keycloak par le réseau partagé.
      # Seule la BASE est surchargée : le realm reste dérivé d'OIDC_ISSUER.
      KEYCLOAK_INTERNAL_URL: "${KEYCLOAK_INTERNAL_URL:-}"
      # Autorité d'INSTANCE pour la gestion des comptes SSO (Réglages → Membres).
      # ⚠️ Vide = personne, jamais « tout le monde ». Le rôle admin d'un espace
      # est auto-attribuable et ne peut donc pas garder une action dont l'effet
      # porte sur le realm partagé par tous les sites.
      IDP_ADMIN_EMAILS: "${IDP_ADMIN_EMAILS:-}"
    # Reached by Nginx Proxy Manager over the shared external network, as
    # gotyeah_notes:3000 (no host port published — same convention as the other
    # apps on this Pi). Add `ports: ["30001:3000"]` if you need direct access.
    networks:
      - npm
    volumes:
      - gotyeah-db:/data
    restart: unless-stopped
    # Sonde lue par le workflow Deploy (.State.Health.Status). Node 24 expose
    # fetch globalement ; on accepte tout statut < 500 (l'app répond, même via
    # une redirection / vers /login).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  gotyeah-db:

networks:
  npm:
    external: true
    name: nginx-proxy-manager_default
